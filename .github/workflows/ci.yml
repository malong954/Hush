name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (universal)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Compile (Apple silicon + Intel, release)
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Assemble and ad-hoc sign Hush.app
        run: |
          BIN="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)"
          mkdir -p build
          scripts/assemble-app.sh "$BIN/Hush" build/Hush.app
          codesign --force --options runtime --entitlements Resources/Hush.entitlements --sign - build/Hush.app
          codesign --verify --strict --verbose=2 build/Hush.app
          lipo -info build/Hush.app/Contents/MacOS/Hush

      - name: Upload unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: Hush-unsigned-${{ github.sha }}
          path: build/Hush.app
          retention-days: 7
